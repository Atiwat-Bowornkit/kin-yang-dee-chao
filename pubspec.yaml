name: kinyangdeechao
description: กิ๋นหยังดีจ้าว - แอปแนะนำเมนูอาหารจากวัตถุดิบที่มี

publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^2.0.0
  image_picker: ^1.0.4
  dio: ^5.3.3
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  flutter_secure_storage: ^11.2.0
  wakelock_plus: ^1.8.1
  uuid: ^4.6.0
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  # ใช้จำลองการบันทึกล้มเหลวในเทสต์
  shared_preferences_platform_interface: ^2.4.2

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8


flutter:

  uses-material-design: true

  assets:
    - assets/branding/logo_vermilion.png
    - assets/branding/logo_fullcolor.png

  fonts:
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Light.ttf
          weight: 300
        - asset: assets/fonts/Kanit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Kanit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Kanit-SemiBold.ttf
          weight: 600



# ตั้งค่า splash แบบ native (สร้างไฟล์ด้วย: dart run flutter_native_splash:create)
flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#FFF5D6"
  image: assets/branding/logo_vermilion.png
  color_dark: "#211410"
  image_dark: assets/branding/logo_fullcolor.png
  android_12:
    color: "#FFF5D6"
    color_dark: "#211410"
    icon_background_color: "#EF3827"
    icon_background_color_dark: "#EF3827"
    image: assets/branding/splash_android12.png
    image_dark: assets/branding/splash_android12.png
